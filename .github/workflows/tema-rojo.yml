{
 "name": "aplicar-tema-rojo",
 "on": {
  "workflow_dispatch": {}
 },
 "permissions": {
  "contents": "write"
 },
 "jobs": {
  "go": {
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Aplicar",
     "run": "python3 - <<'PYEOF'\nimport base64,shutil,os\np='grow/index.html'\nh=open(p,encoding='utf-8').read()\nif 'id=\"tema-rojo\"' in h:\n    print('ya aplicado')\nelse:\n    os.makedirs('grow/versiones',exist_ok=True)\n    shutil.copy(p,'grow/versiones/index_antes_tema_rojo.html')\n    c=base64.b64decode('').decode()\n    h=h.replace('</head>','<style id=\"tema-rojo\">'+c+'</style></head>',1)\n    open(p,'w',encoding='utf-8').write(h)\n    print('aplicado')\nPYEOF"
    },
    {
     "name": "Commit",
     "run": "git config user.name grow-bot\ngit config user.email grow-bot@users.noreply.github.com\ngit add -A grow\ngit commit -m 'GROW: tema rojo estilo Netflix' || echo nada\ngit push"
    }
   ]
  }
 }
}
