<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuestionario · GROW Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3f0;--ink:#0f0f0f;--red:#e50914;--mut:#5b5b60;--card:#fff;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px}
.brand{font-weight:800;letter-spacing:.5px}.brand b{color:var(--red)}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:14px 0 6px;text-transform:uppercase}
.sub{color:var(--mut);font-weight:600;margin-bottom:22px}
.bar{height:8px;background:#e4e1dc;border-radius:99px;overflow:hidden;margin:0 0 20px}.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.06);border-left:6px solid var(--red)}
.qn{color:var(--red);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.q{font-size:20px;font-weight:700;margin:8px 0 18px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:600;font-size:16px;padding:14px 16px;margin:10px 0;border-radius:12px;border:2px solid #e4e1dc;background:#fff;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:#ecfdf3}.opt.bad{border-color:var(--bad);background:#fef2f2}
.opt:disabled{color:var(--ink);cursor:default}
.exp{margin-top:14px;padding:14px;border-radius:12px;background:#f7f5f2;font-weight:500;line-height:1.5;display:none}
.btn{margin-top:18px;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:14px 26px;font:inherit;font-weight:800;cursor:pointer;display:none}
.btn.red{background:var(--red)}
.score{font-family:Anton,Impact,sans-serif;font-size:72px;line-height:1;margin:6px 0}
.list a{display:block;padding:14px 16px;margin:10px 0;background:#fff;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:700;border:2px solid #e4e1dc}
.list a:hover{border-color:var(--red)}
.foot{margin-top:26px;color:var(--mut);font-size:13px}
</style></head><body><div class="wrap">
<div class="brand"><b>GROW</b> ACADEMY · Cuestionarios</div><div id="app"></div>
<div class="foot">Jesús Ibarra · Autoridad y Comunicación</div></div>
<script>
const Q={"n1m1": {"t": "Nivel 1 · Módulo 1: Mentalidad e identidad", "q": [{"q": "Según la clase, ¿cuál es la diferencia entre hablar y comunicar?", "o": ["Comunicar es transmitir lo que realmente necesitás en ese momento; hablar es solo decir palabras", "Hablar es más formal que comunicar", "Comunicar es hablar más fuerte", "No hay ninguna diferencia"], "a": 0, "e": "Cualquiera puede pararse a hablar; comunicar es lograr transmitir lo que necesitás para ese momento."}, {"q": "¿Qué muestra el contraste entre Martin Luther King y Hitler?", "o": ["Que la oratoria sirve solo para la política", "Que la habilidad de hablar mueve masas, y que la ética del orador importa", "Que hay que copiar a los grandes oradores", "Que hablar bien es un don con el que se nace"], "a": 1, "e": "Las dos personas movieron masas con las palabras; la diferencia está en la ética con que se usa la habilidad."}, {"q": "¿Cuál es el orden correcto de las cuatro etapas de la competencia?", "o": ["Competencia consciente, incompetencia consciente, competencia inconsciente, incompetencia inconsciente", "Incompetencia inconsciente, incompetencia consciente, competencia consciente, competencia inconsciente", "Incompetencia consciente, incompetencia inconsciente, competencia inconsciente, competencia consciente", "Competencia inconsciente, competencia consciente, incompetencia consciente, incompetencia inconsciente"], "a": 1, "e": "Empezás sin saber que no sabés, tomás conciencia, lo hacés con total foco y, con repetición, se vuelve natural."}, {"q": "¿Qué es la competencia consciente?", "o": ["Cuando no sabés que no sabés", "Cuando lo hacés bien pero necesitás el 100 % de tu atención", "Cuando lo hacés sin pensar", "Cuando te das cuenta de que no sabés"], "a": 1, "e": "Es como atar el cordón concentrándote en cada paso: si te desenfocás, se pierde."}, {"q": "¿Cuáles son las tres patas de la identidad?", "o": ["Autoimagen, autoestima e ideal propio", "Conocimiento, habilidad y actitud", "Ansiedad, bloqueo y juicio", "Calidez, competencia y lenguaje no verbal"], "a": 0, "e": "La identidad se compone de cómo te ves, cuánto te valorás y quién querés ser."}, {"q": "¿Cuál es la característica de la autoestima?", "o": ["Es objetiva y fija", "Es subjetiva y puede subir y bajar con el tiempo", "Es lo mismo que el ideal propio", "Solo cambia con el dinero"], "a": 1, "e": "La autoimagen es objetiva y fija; la autoestima es subjetiva y varía como una escalera."}, {"q": "¿Cuáles son los dos pasos para elevar tu autoimagen?", "o": ["Memorizar discursos y practicar", "Diálogo interno en tiempo presente y evidencia", "Leer mucho y viajar", "Compararte con otros y copiar sus hábitos"], "a": 1, "e": "Te decís quién sos en presente y lo respaldás con pequeñas acciones reales."}]}, "n1m2": {"t": "Nivel 1 · Módulo 2: Autoestima, valor y visualización", "q": [{"q": "¿En base a qué se construye la confianza, según la clase?", "o": ["En base a objetivos cumplidos", "En base a la suerte", "En base a lo que opinan los demás", "En base a tener mucho conocimiento"], "a": 0, "e": "Cada objetivo que completás libera dopamina y te da impulso."}, {"q": "¿Cómo son los tres objetivos diarios que propone la clase?", "o": ["Muy grandes y difíciles", "Sencillos e indispensables: si no los cumplís no te vas a dormir", "Solo laborales", "Opcionales"], "a": 1, "e": "Pueden ser tan simples como tomar cuatro vasos de agua o leer 10 páginas."}, {"q": "¿Por qué la gratitud ayuda a subir la autoestima?", "o": ["Porque el cerebro se enfoca en un solo sentimiento a la vez", "Porque hace olvidar las metas", "Porque reemplaza el trabajo", "Porque da más conocimiento"], "a": 0, "e": "Si estás agradecido no podés estar triste al mismo tiempo."}, {"q": "¿Cuál es la fórmula del valor en el mercado laboral y social?", "o": ["Dinero más contactos", "Conocimiento más habilidad por actitud", "Título más experiencia", "Suerte más talento"], "a": 1, "e": "La actitud multiplica el conocimiento y la habilidad."}, {"q": "¿Qué es la actitud según la clase?", "o": ["Tener buen humor", "Voluntad para actuar", "Ser simpático", "Tener experiencia"], "a": 1, "e": "Actitud es voluntad para actuar: el todo o nada."}, {"q": "¿Qué pasa si tenés mucho conocimiento y habilidad pero cero actitud?", "o": ["Te pagan más", "Ese valor se queda encerrado en vos y no se transmite", "La habilidad crece sola", "Nada, todo sigue igual"], "a": 1, "e": "Sin actitud el valor no llega a los demás, y por eso no te lo pagan."}, {"q": "¿Qué es el estado de flow?", "o": ["Un estado de relajación total sin pensar", "Inmersión total en una actividad, donde se pierde la noción del tiempo", "Un tipo de meditación en grupo", "Un ejercicio de respiración"], "a": 1, "e": "Es un estado de trabajo profundo, con mucha concentración y alta productividad."}, {"q": "¿Para qué sirve la sensación de la visualización de tu mejor versión?", "o": ["Para olvidarte de tus problemas", "Como ancla emocional para actuar, sentir y pensar como esa versión", "Para dormir mejor", "Para memorizar un discurso"], "a": 1, "e": "La sensación que sentiste podés usarla de ancla emocional cuando la necesites."}]}, "n1m3": {"t": "Nivel 1 · Módulo 3: Miedo escénico, carisma y cuerpo", "q": [{"q": "¿Cuáles son los tres dragones al hablar en público?", "o": ["Ansiedad, bloqueo y juicio", "Muletillas, silencio y ritmo", "Calidez, competencia y carisma", "Postura, gesto y mirada"], "a": 0, "e": "La ansiedad, el bloqueo y el juicio forman el miedo escénico."}, {"q": "¿Qué es el bloqueo?", "o": ["Temblar la voz", "Quedarte en blanco o terminar hablando de otra cosa", "Pensar qué van a decir de vos", "Hablar demasiado rápido"], "a": 1, "e": "Es cuando empezás hablando de algo y terminás en otra cosa, o te quedás en blanco."}, {"q": "Si te equivocás en vivo, ¿qué conviene hacer?", "o": ["Pedir disculpas al público", "Parar la presentación", "Respirar profundo y seguir, haciendo el error insignificante", "Reírte nervioso y explicarlo mucho"], "a": 2, "e": "Cuando el orador hace su error insignificante, el público ni lo nota."}, {"q": "¿Cuál es uno de los chips mentales para subir al escenario?", "o": ["Tu público quiere que te equivoques", "Tu público quiere aprender y la mayoría no te juzga", "Tenés que demostrar que sos el mejor", "Tenés que evitar mirar al público"], "a": 1, "e": "El que te juzga mucho suele ser tu propio ego."}, {"q": "Si una persona no te presta atención mientras hablás, ¿qué sugiere la clase?", "o": ["Pedirle que salga", "Caminar hacia ella y ponerle tu contacto visual", "Hablar más fuerte", "Ignorarla por completo"], "a": 1, "e": "La mirada conecta y atrae la atención: esa persona va a sentir tu contacto visual."}, {"q": "¿Cuáles son los dos elementos principales del carisma?", "o": ["Calidez y competencia", "Ansiedad y confianza", "Volumen y velocidad", "Dinero y poder"], "a": 0, "e": "Se suma un tercer elemento implícito: el lenguaje no verbal."}, {"q": "¿Qué pasa si tenés competencia pero no calidez?", "o": ["Te ven como alguien buena onda", "Te ven como soberbio y podés despertar envidia", "Nadie se da cuenta", "Se te considera carismático"], "a": 1, "e": "Sin calidez, tu habilidad se percibe como soberbia."}, {"q": "¿Qué caracteriza la postura de poder?", "o": ["Brazos cruzados y cabeza baja", "Pies a la altura de los hombros, pecho afuera, barbilla arriba y mirada al frente", "Moverse rápido por el escenario", "Mirar al piso para concentrarse"], "a": 1, "e": "Con tu cuerpo le decís a tu cerebro “me siento seguro”."}]}, "n1m4": {"t": "Nivel 1 · Módulo 4: Voz, pausas e historias", "q": [{"q": "¿Cuál es el primer paso para eliminar las muletillas?", "o": ["Hablar más rápido", "Identificar cuáles son las tuyas", "Memorizar el discurso", "Evitar hablar en público"], "a": 1, "e": "Tenés que saber cuáles usás para poder trabajar sobre ellas."}, {"q": "¿Por qué aparecen más muletillas cuando hablamos muy rápido?", "o": ["Porque el cerebro no tiene tiempo para pensar y se llenan los espacios vacíos", "Porque tenemos más energía", "Porque el público lo pide", "Porque respiramos mejor"], "a": 0, "e": "Hablar más lento le da tiempo al cerebro a procesar lo que vas a decir."}, {"q": "Cuando sentís que viene una muletilla, ¿qué hacés?", "o": ["La decís más rápido", "Hacés una pausa consciente y te quedás en silencio", "Te reís", "Cambiás de tema"], "a": 1, "e": "Es la pausa consciente: silencio en lugar de relleno."}, {"q": "¿Cuándo conviene hacer una pausa para generar expectativa?", "o": ["Antes de decir la idea central", "Solo al final de la charla", "Nunca", "En cada palabra"], "a": 0, "e": "También conviene pausar después, para que el público asiente la idea."}, {"q": "¿Qué significa pensar el discurso como un electrocardiograma?", "o": ["Hablar con el mismo tono todo el tiempo", "Tener puntos altos y bajos, variando ritmo y tono", "Hablar siempre rápido", "Hablar solo de salud"], "a": 1, "e": "Una línea recta aburre al público; la variación lo mantiene enganchado."}, {"q": "¿Qué NO forma parte de los 5 minutos antes de hablar?", "o": ["Respiración", "Memorizar el discurso palabra por palabra", "Postura de poder", "Sonreír"], "a": 1, "e": "La rutina es respiración, visualización, postura de poder, anclar tu valor y sonrisa."}, {"q": "¿Cuáles son los componentes de una buena historia?", "o": ["Personaje, problema, solución y moraleja", "Introducción, datos, gráficos y cierre", "Chiste, anécdota, cita y pregunta", "Saludo, tema, ejemplo y despedida"], "a": 0, "e": "Es el viaje del héroe: alguien con un problema que lo supera y aprende algo."}, {"q": "¿Por qué no hay que memorizar el discurso palabra por palabra?", "o": ["Porque es aburrido", "Porque si se te olvida una palabra se te cae todo el discurso", "Porque dura mucho", "Porque el público lo nota siempre"], "a": 1, "e": "Conviene memorizar la estructura, el orden de ideas, no las palabras."}]}, "n2m1": {"t": "Nivel 2 · Módulo 1: Cómo decide la gente", "q": [{"q": "¿Por qué el cerebro automatiza muchas decisiones?", "o": ["Para ahorrar energía y ayudarte a sobrevivir", "Porque no le interesan las decisiones", "Para decidir siempre lo contrario", "Porque copia lo que hacen los demás"], "a": 0, "e": "El objetivo principal del cerebro es sobrevivir; por eso ahorra energía automatizando decisiones."}, {"q": "¿Cuál es el orden del mapa de la persuasión?", "o": ["Acción, conexión, credibilidad, atención", "Ser escuchado, ser creíble, conectar y mover a la acción", "Conectar, vender, cerrar y cobrar", "Hablar, convencer, negociar y despedirse"], "a": 1, "e": "Primero te escuchan, después te creen, luego conectás y finalmente movés a la acción."}, {"q": "¿Cuál es la estructura de la técnica de negociación del curso?", "o": ["“Por favor, ¿podrías…?”", "“Si yo te consigo…, ¿vos estarías dispuesto a…?”", "“Te lo dejo más barato si…”", "“Todos lo están comprando…”"], "a": 1, "e": "“Si yo, tú” convierte un pedido en un intercambio."}, {"q": "¿Cuál es la diferencia entre persuadir y manipular?", "o": ["No hay diferencia", "Persuadir usa técnicas y manipular no", "Al persuadir ganan las dos partes; al manipular gana uno solo", "Manipular es más ético"], "a": 2, "e": "Se pueden usar las mismas técnicas; cambia la intención: beneficio mutuo o beneficio egoísta."}, {"q": "¿Cuáles son los tres filtros para saber si estás persuadiendo?", "o": ["Rapidez, precio y volumen", "Verdad, beneficio para la otra persona y transparencia", "Emoción, lógica y autoridad", "Escasez, urgencia y prueba social"], "a": 1, "e": "Si falla uno de los tres filtros, estás manipulando."}]}, "n2m2": {"t": "Nivel 2 · Módulo 2: Atajos del cerebro y la tríada de Aristóteles", "q": [{"q": "¿Qué son los sesgos psicológicos?", "o": ["Errores de ortografía", "Atajos que usa el cerebro para decidir", "Técnicas de respiración", "Tipos de discurso"], "a": 1, "e": "Seguir a la mayoría o confiar en una autoridad son atajos del cerebro."}, {"q": "Según la clase, ¿cómo decidimos al comprar?", "o": ["Primero razonamos y después sentimos", "Solo con la lógica", "Primero sentimos y después justificamos con la razón", "Al azar"], "a": 2, "e": "La emoción hace actuar y desear; la razón justifica después."}, {"q": "En la tríada de Aristóteles, ¿qué es el ethos?", "o": ["La emoción", "La lógica", "La autoridad o credibilidad", "La estructura del discurso"], "a": 2, "e": "Ethos es autoridad; pathos, emoción; logos, lógica."}, {"q": "¿Qué tres elementos necesita una historia para quedarse en la mente?", "o": ["Un chiste, un dato y una cita", "Un personaje, un lugar o situación específica y uno o más sentidos", "Una introducción, un nudo y un final feliz", "Muchos detalles técnicos"], "a": 1, "e": "Personaje en escena específica sintiendo algo: así la historia se siente."}, {"q": "¿Cómo se transforma un dato aburrido en uno interesante?", "o": ["Diciéndolo más rápido", "Con la fuente, la cifra y un significado u opinión", "Repitiéndolo tres veces", "Sin decir la fuente"], "a": 1, "e": "La fuente da credibilidad; el significado y la opinión hacen que se recuerde."}]}, "n2m3": {"t": "Nivel 2 · Módulo 3: Sesgos que mueven a decidir", "q": [{"q": "¿Cómo se activa la reciprocidad?", "o": ["Pidiendo un descuento", "Dando más de lo que la persona espera, sin esperar nada a cambio", "Hablando de tus logros", "Ofreciendo diez opciones"], "a": 1, "e": "Cuando das la milla extra, la persona siente que te debe algo."}, {"q": "“Dos de cada tres paraguayos usan…” es un ejemplo de:", "o": ["Escasez", "Reciprocidad", "Prueba social", "Rapport"], "a": 2, "e": "La prueba social muestra que la mayoría ya eligió."}, {"q": "¿Qué dice la aversión a la pérdida?", "o": ["Que nadie quiere ganar", "Que duele más perder que ganar: hay que mostrar el costo de no actuar", "Que hay que bajar el precio", "Que conviene esperar"], "a": 1, "e": "Mostrar lo que la persona pierde si no actúa ahora es más fuerte que mostrar lo que gana."}, {"q": "¿Cuántas opciones conviene ofrecer a un cliente?", "o": ["Todas las que tengas", "Una sola", "Dos o tres opciones bien filtradas", "Diez para que elija"], "a": 2, "e": "Demasiadas opciones dificultan la decisión: el cliente se marea."}, {"q": "¿Qué son las tres D?", "o": ["Dato, dinero y decisión", "Dolor, deseo y dudas de la persona", "Despegue, desarrollo y despedida", "Disciplina, dedicación y descanso"], "a": 1, "e": "Hablar del dolor, del deseo o de las dudas de la otra persona capta y mantiene su atención."}]}, "n2m4": {"t": "Nivel 2 · Módulo 4: Presencia, conexión y estructura", "q": [{"q": "¿Para qué sirven la postura de poder y el suspiro fisiológico?", "o": ["Para hablar más rápido", "Para entrar en estado de claridad, confianza y autoridad antes de hablar", "Para aprender un discurso de memoria", "Para relajarse después de hablar"], "a": 1, "e": "Postura expandida y respiración consciente te sacan del modo supervivencia."}, {"q": "¿Cuánto debería durar tu elevator pitch?", "o": ["Menos de 30 segundos", "Cinco minutos", "Lo que haga falta", "Una hora"], "a": 0, "e": "En menos de 30 segundos respondés quién sos, qué hacés, a quién ayudás, qué te distingue y cómo contactarte."}, {"q": "¿Cuál NO es un elemento del rapport instantáneo?", "o": ["Escucha activa", "Técnica del espejo", "Alineación de valores", "Hablar todo el tiempo de vos"], "a": 3, "e": "El rapport se crea escuchando, reflejando, empatizando y encontrando puntos en común."}, {"q": "¿Cómo conviene abrir un discurso según la clase?", "o": ["“Bienvenidos, mi nombre es…”", "Con una frase impactante, un dato, una pregunta o una historia", "Pidiendo disculpas por los nervios", "Leyendo el índice"], "a": 1, "e": "Hay que atrapar la atención en los primeros 10 segundos; la presentación puede venir después."}, {"q": "¿Qué estructura se usa en el vuelo del discurso de práctica?", "o": ["Afirmación, explicación y ejemplo", "Saludo, chiste y despedida", "Problema, precio y cierre", "Dato, dato y dato"], "a": 0, "e": "La estructura AEE: afirmación, explicación y ejemplo."}]}};
const app=document.getElementById('app');const key=(location.hash||'').slice(1)||new URLSearchParams(location.search).get('q');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function home(){app.innerHTML='<h1>Elegí tu cuestionario</h1><div class="sub">Aprobás con 80% o más.</div><div class="list">'+Object.entries(Q).map(([k,v])=>`<a href="#${k}">${esc(v.t)}</a>`).join('')+'</div>'}
function run(k){const D=Q[k];let i=0,ok=0;const order=D.q.map((q,ix)=>ix);
 function show(){const q=D.q[order[i]];app.innerHTML=`<h1>${esc(D.t.split(': ')[1]||D.t)}</h1><div class="sub">${esc(D.t.split(': ')[0])}</div><div class="bar"><i style="width:${i/D.q.length*100}%"></i></div><div class="card"><div class="qn">Pregunta ${i+1} de ${D.q.length}</div><div class="q">${esc(q.q)}</div>${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}<div class="exp" id="exp"></div><button class="btn" id="nx">${i+1<D.q.length?'Siguiente →':'Ver resultado'}</button></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('ok')});if(j===q.a)ok++;else b.classList.add('bad');const e=document.getElementById('exp');e.innerHTML=(j===q.a?'<b>✅ ¡Correcto!</b> ':'<b>❌ No era esa.</b> ')+esc(q.e);e.style.display='block';document.getElementById('nx').style.display='inline-block'});
  document.getElementById('nx').onclick=()=>{i++;i<D.q.length?show():end()}}
 function end(){const p=Math.round(ok/D.q.length*100),pass=p>=80;app.innerHTML=`<h1>${pass?'¡Aprobado! 🏆':'Casi… 💪'}</h1><div class="sub">${esc(D.t)}</div><div class="card"><div class="score" style="color:${pass?'var(--ok)':'var(--red)'}">${p}%</div><p><b>${ok} de ${D.q.length}</b> respuestas correctas.</p><p>${pass?'Excelente. Comentá tu puntaje en la comunidad, en <b>🏆 Victorias</b>, y seguí con el próximo módulo.':'Necesitás 80% para aprobar. Volvé a ver las clases que te costaron y reintentá: así se fija lo aprendido.'}</p><button class="btn red" style="display:inline-block" onclick="location.reload()">Reintentar</button> <button class="btn" style="display:inline-block" onclick="location.hash='';location.reload()">Otros cuestionarios</button></div>`}
 show()}
Q[key]?run(key):home(); window.onhashchange=()=>location.reload();
</script></body></html>
